<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intent · IntentOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='white'/%3E%3Cpath d='M14 6 L6 6 L6 34 L14 34' fill='none' stroke='%23ff4d2e' stroke-width='5'/%3E%3Cpath d='M26 6 L34 6 L34 34 L26 34' fill='none' stroke='%23ff4d2e' stroke-width='5'/%3E%3Crect x='16' y='16' width='8' height='8' fill='%23111111'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/intentos.css" />
<style>
  .page { max-width: 960px; margin: 0 auto; padding: 56px clamp(16px,3vw,40px); }
  .grid6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; font-family: var(--mono); font-size: 13px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); padding: 20px 0; margin-bottom: 32px; }
  .grid6 .k { color: var(--faint); font-size: 11px; margin-bottom: 3px; }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="/"><svg width="18" height="18" viewBox="0 0 40 40" aria-hidden><path d="M14 6 L6 6 L6 34 L14 34" fill="none" stroke="#ff4d2e" stroke-width="5" stroke-linecap="square"/><path d="M26 6 L34 6 L34 34 L26 34" fill="none" stroke="#ff4d2e" stroke-width="5" stroke-linecap="square"/><rect x="16" y="16" width="8" height="8" fill="#111111"/></svg><span>IntentOS</span></a>
  <nav><a href="/">Home</a><a href="/app">App</a><a href="/agents">Agents</a><a href="/docs">Docs</a><a href="/spec">Spec</a></nav>
  <span class="chip-net">X LAYER · 1952 · TESTNET</span>
  <a class="btn" href="/app">Connect</a>
</header>
<div class="page" id="root"><p class="empty">Loading intent…</p></div>
<footer class="foot" style="max-width:960px">
  <span>© 2026 IntentOS · live on X Layer testnet</span>
  <div class="foot-links"><a href="/how">How it works</a><a href="/solvers">Solvers</a><a href="/docs">Docs</a><a href="/spec">Spec</a></div>
</footer>
<script type="module">
const TAG = "n:";
const decode = (text) => JSON.parse(text, (_k, v) => (typeof v === "string" && v.startsWith(TAG) ? BigInt(v.slice(2)) : v));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const short = (a) => a && a.length > 12 ? `${a.slice(0, 8)}…${a.slice(-6)}` : (a ?? "");
const id = new URLSearchParams(location.search).get("id") ?? "";
const tone = (label) => /fulfill/i.test(label) ? "win" : /select|bid|taking/i.test(label) ? "bid" : /cancel|expir|unknown/i.test(label) ? "no" : "";
const iso = (t) => t ? new Date(Number(t) * 1000).toISOString().replace(".000Z", "Z") : "-";

async function load() {
  const root = document.getElementById("root");
  if (!id.startsWith("0x") || id.length !== 66) {
    root.innerHTML = `<p class="err">Missing intent id. Open this page as /intent/?id=0x…</p>`;
    return;
  }
  document.title = `Intent ${short(id)} · IntentOS`;
  try {
    const res = await fetch(`/api/intent?id=${encodeURIComponent(id)}`);
    const data = decode(await res.text());
    if (!res.ok) throw new Error(data.error ?? res.statusText);
    const x = data.explorer ?? "https://web3.okx.com/explorer/xlayer-testnet";
    const bids = (data.bids ?? []).filter((b) => !b.withdrawn);
    const solver = data.selectedSolver && data.selectedSolver !== "0x0000000000000000000000000000000000000000" ? short(data.selectedSolver) : "-";
    root.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:32px">
        <div>
          <h6 class="kicker">Intent record</h6>
          <div class="mono" style="font-size:15px;word-break:break-all">${esc(id)}</div>
        </div>
        <span class="pill ${tone(data.statusLabel)}">${esc(data.statusLabel)}</span>
      </div>
      <div class="grid6">
        <div><div class="k">kind</div>${esc(data.kindLabel)}</div>
        <div><div class="k">owner</div><a title="${esc(data.owner)}" href="${x}/address/${data.owner}" target="_blank">${esc(short(data.owner))}</a></div>
        <div><div class="k">winning solver</div>${esc(solver)}</div>
        <div><div class="k">auction ends</div>${iso(data.auctionEndsAt)}</div>
        <div><div class="k">deadline</div>${iso(data.deadline)}</div>
        <div><div class="k">registry</div><a href="${x}/address/${data.contracts?.intentRegistry}" target="_blank">${short(data.contracts?.intentRegistry)}</a></div>
      </div>
      <h6 class="lab">Commitment</h6>
      <div class="hash-box" style="margin-bottom:8px"><div class="k" style="color:var(--faint);font-size:10.5px;margin-bottom:4px">outcomeHash</div>${esc(data.outcomeHash)}</div>
      <div class="hash-box" style="margin-bottom:36px"><div class="k" style="color:var(--faint);font-size:10.5px;margin-bottom:4px">policyHash</div>${esc(data.policyHash)}</div>
      <h6 class="lab">Auction</h6>
      ${bids.length ? `<table>
        <tr><th>solver</th><th>fee</th><th>eta</th><th>guarantees</th></tr>
        ${bids.map((b) => `<tr>
          <td class="mono">${esc(short(b.solver))}${data.selectedSolver && b.solver.toLowerCase() === data.selectedSolver.toLowerCase() ? " ✓" : ""}</td>
          <td class="mono">${(b.feeBps / 100).toFixed(2)}%</td>
          <td class="mono">${b.etaSeconds}s</td>
          <td>${(b.guaranteedOut ?? []).length} legs</td>
        </tr>`).join("")}
      </table>` : `<p class="empty">No bids recorded yet.</p>`}
      <div class="card" style="margin-top:36px">
        <div style="font-family:var(--display);font-weight:700;font-size:14px;text-transform:uppercase;margin-bottom:6px">Dispute this selection</div>
        <p class="hint" style="margin:0 0 12px">Anyone can call challengeSelection if a recorded bid Pareto-dominates the pick. The coordinator's bond is slashed and the challenger takes a cut.</p>
        <div id="challengeBox">${challengeMarkup(data, bids)}</div>
      </div>
      <p class="hint" style="margin-top:24px">Settlement measures recipient balance deltas. A miss on max(user minOut, solver guarantee) reverts the whole fill.</p>
    `;
  } catch (error) {
    root.innerHTML = `<p class="err">${esc(error.message)}</p>`;
  }
}
function asBig(v) {
  if (typeof v === "bigint") return v;
  const s = String(v ?? "0");
  return s.startsWith("n:") ? BigInt(s.slice(2)) : BigInt(s);
}
function dominates(a, b) {
  if (Number(a.feeBps) > Number(b.feeBps)) return false;
  const ag = a.guaranteedOut ?? [];
  const bg = b.guaranteedOut ?? [];
  if (ag.length !== bg.length) return false;
  let strict = Number(a.feeBps) < Number(b.feeBps);
  for (let i = 0; i < ag.length; i++) {
    const ga = asBig(ag[i]);
    const gb = asBig(bg[i]);
    if (ga < gb) return false;
    if (ga > gb) strict = true;
  }
  return strict;
}
function challengeMarkup(data, bids) {
  if (!/select/i.test(data.statusLabel ?? "")) {
    return `<p class="empty">Challenge is open only while a winner is selected and not yet settled.</p>`;
  }
  const winner = bids.find((b) => data.selectedSolver && b.solver.toLowerCase() === data.selectedSolver.toLowerCase());
  if (!winner) return `<p class="empty">No selected bid to compare.</p>`;
  const better = bids.find((b) => !b.withdrawn && b.solver.toLowerCase() !== winner.solver.toLowerCase() && dominates(b, winner));
  if (!better) return `<p class="empty">No recorded bid dominates this pick.</p>`;
  return `<button class="btn" id="challengeBtn" type="button" data-bid="${better.bidId}">Challenge with bid ${better.bidId} (${esc(short(better.solver))})</button>
    <p class="hint" style="margin-top:8px" id="challengeNote">Pays you a cut of the coordinator bond if the contract agrees.</p>`;
}

document.getElementById("root").addEventListener("click", async (event) => {
  const btn = event.target.closest("#challengeBtn");
  if (!btn) return;
  const bidId = Number(btn.dataset.bid);
  const w = window;
  const eth = w.okxwallet ?? w.ethereum;
  if (!eth) { document.getElementById("challengeNote").textContent = "No injected wallet."; return; }
  try {
    btn.disabled = true;
    const accounts = await eth.request({ method: "eth_requestAccounts" });
    const from = accounts[0];
    const intentId = new URLSearchParams(location.search).get("id");
    const prepared = await fetch("/api/ops", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ kind: "challenge", intentId, bidId }),
    });
    const call = await prepared.json();
    if (!prepared.ok) throw new Error(call.error ?? "could not encode challenge");
    const tx = await eth.request({
      method: "eth_sendTransaction",
      params: [{ from, to: call.to, data: call.data, value: "0x0" }],
    });
    document.getElementById("challengeNote").textContent = `submitted ${tx}`;
  } catch (error) {
    document.getElementById("challengeNote").textContent = error.message;
  } finally {
    btn.disabled = false;
  }
});

await load();
setInterval(load, 8_000);
</script>
</body>
</html>
